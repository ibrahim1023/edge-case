<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EdgeCase — Voice-First Test Scenario Agent</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 1rem; }
    input, button { font-size: 1rem; padding: 0.5rem; }
    #output { white-space: pre-wrap; background: #f6f8fa; padding: 1rem; border-radius: 0.5rem; margin-top: 1rem; }
    .step { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>EdgeCase</h1>
  <p>Enter a public Python repo in <code>owner/repo</code> format.</p>

  <div class="step">
    <input id="repo" type="text" placeholder="ibrahim1023/ci-rootcause" value="ibrahim1023/ci-rootcause" />
    <button id="start">Start Session</button>
  </div>

  <div class="step">
    <button id="set">Set Repository</button>
    <button id="confirm">Confirm</button>
    <button id="analyze">Analyze</button>
  </div>

  <div class="step">
    <input id="scenarioIdx" type="number" value="0" min="0" max="4" />
    <button id="implement">Implement Selected</button>
    <button id="explain">Explain Selected</button>
  </div>

  <pre id="output"></pre>

  <script>
    const $ = (id) => document.getElementById(id);
    const out = (msg) => { $('output').textContent += '\n' + msg; };
    let sessionId = null;
    let findings = [];

    async function api(method, path, body) {
      const opts = { method };
      if (body) {
        opts.headers = { 'Content-Type': 'application/json' };
        opts.body = JSON.stringify(body);
      }
      const res = await fetch(path, opts);
      const data = await res.json();
      if (!res.ok) throw new Error(JSON.stringify(data, null, 2));
      return data;
    }

    $('start').onclick = async () => {
      const data = await api('POST', '/session');
      sessionId = data.id;
      out('Session: ' + sessionId);
    };

    $('set').onclick = async () => {
      const data = await api('POST', `/session/${sessionId}/repository`, { repository: $('repo').value });
      out('Set: ' + data.repository_url);
    };

    $('confirm').onclick = async () => {
      const data = await api('POST', `/session/${sessionId}/confirm`);
      out('Confirmed: ' + data.repository);
    };

    $('analyze').onclick = async () => {
      out('Analyzing...');
      await api('POST', `/session/${sessionId}/analyze`);
      const poll = setInterval(async () => {
        const data = await api('GET', `/session/${sessionId}/status`);
        if (data.status === 'completed') {
          clearInterval(poll);
          const f = await api('GET', `/session/${sessionId}/findings`);
          findings = f;
          out('Findings (' + findings.length + '):');
          findings.forEach((s, i) => {
            out(`${i + 1}. [${s.devin_priority}] ${s.scenario} (${s.area})`);
          });
        } else if (data.status === 'failed') {
          clearInterval(poll);
          out('Analysis failed: ' + (data.error || 'unknown error'));
        }
      }, 1000);
    };

    $('explain').onclick = async () => {
      const idx = parseInt($('scenarioIdx').value, 10);
      if (idx < 0 || idx >= findings.length) { out('No scenario at index ' + idx); return; }
      out('Explaining scenario at index ' + idx + '...');
      const data = await api('POST', `/session/${sessionId}/explain`, { scenario_index: idx });
      out('Explanation: ' + data.explanation);
    };

    $('implement').onclick = async () => {
      const idx = parseInt($('scenarioIdx').value, 10);
      const scenario = findings[idx];
      if (!scenario) { out('No scenario at index ' + idx); return; }
      out('Implementing scenario: ' + scenario.scenario);
      const data = await api('POST', `/session/${sessionId}/scenarios/${scenario.id}/implement`);
      out('Result: ' + data.passed + ' passed, ' + data.failed + ' failed. ' + data.summary);
    };
  </script>
</body>
</html>
